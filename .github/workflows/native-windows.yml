name: Native Windows verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/build.gradle
            backend/settings.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Initialize native PostgreSQL
        run: .\scripts\setup.ps1 -DownloadPostgres -SkipInstall
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency install failed' }
      - name: Verify committed API contract
        run: |
          bun scripts/generate-openapi.mjs
          if ($LASTEXITCODE -ne 0) { throw 'OpenAPI generation failed' }
          git diff --exit-code -- contracts/openapi.json
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate and commit contracts/openapi.json' }
      - name: Run backend and frontend checks
        run: .\scripts\test.ps1
      - name: Install Chromium
        working-directory: frontend
        run: |
          bunx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
      - name: Start demonstration application
        run: .\scripts\dev.ps1
      - name: Verify browser screens
        working-directory: frontend
        run: |
          bun run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Browser screen tests failed' }
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-test-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
            frontend/playwright-report/
            frontend/test-results/
            .logs/*.log
      - name: Stop owned native processes
        if: always()
        run: .\scripts\stop-dev.ps1 -Database
