name: Native Windows verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Initialize native PostgreSQL and isolated databases
        run: .\scripts\setup-dev.ps1 -DownloadPostgres -SkipInstall
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency install failed' }
      - name: Verify committed API contract
        run: |
          bun scripts/generate-openapi.mjs
          if ($LASTEXITCODE -ne 0) { throw 'OpenAPI generation failed' }
          git diff --exit-code -- contracts/openapi.json
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate and commit contracts/openapi.json' }
      - name: Compile and test against native PostgreSQL
        run: .\scripts\test.ps1
      - name: Verify isolated HTTP workflows and concurrency
        run: .\scripts\test-api.ps1 -SkipBuild -LoadSmoke
      - name: Install browser for UI verification
        working-directory: frontend
        run: |
          bunx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
      - name: Start demonstration application
        run: .\scripts\start-dev.ps1
      - name: Verify browser screens
        working-directory: frontend
        run: |
          bun run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Browser screen tests failed' }
      - name: Verify complete customer and host browser journey
        run: |
          .\scripts\reset-demo.ps1
          bun tests/browser-smoke.ts
          if ($LASTEXITCODE -ne 0) { throw 'Full browser workflow failed' }
      - name: Stop application and verify native backup restore
        run: |
          .\scripts\stop-dev.ps1
          .\scripts\verify-backup.ps1
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-test-evidence
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            frontend/playwright-report/
            frontend/test-results/
            .artifacts/browser/
            .artifacts/load-smoke.json
            .logs/*.log
      - name: Stop owned native processes
        if: always()
        run: .\scripts\stop-dev.ps1 -Database
