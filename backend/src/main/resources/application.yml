server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: cedar-queue
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cedar_queue}
    username: ${DATABASE_USERNAME:cedar}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-init-sql: SET lock_timeout = '3s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  task:
    scheduling:
      pool:
        size: 2
logging:
  level:
    org.hibernate.orm.jdbc.error: 'OFF'
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.SQL: 'OFF'
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
app:
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  jobs-enabled: ${JOBS_ENABLED:true}
  demo: false
---
spring:
  config:
    activate:
      on-profile: demo,dev
server:
  servlet:
    session:
      cookie:
        secure: false
app:
  demo: true
